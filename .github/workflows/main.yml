name: Deploy Rabat Surf Club

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify static output
        run: |
          echo "Checking GitHub Pages output..."
          test -f dist/client/index.html
          echo "index.html found:"
          ls -la dist/client

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Rabat Surf Club artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: rabat-surf-club-pages-${{ github.run_id }}
          path: ./dist/client
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Rabat Surf Club to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: rabat-surf-club-pages-${{ github.run_id }}